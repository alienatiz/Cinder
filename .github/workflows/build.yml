name: Build

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    # Run manually when accumulated dev work is ready for staging validation.
    inputs:
      test_release:
        description: Prepare a test release draft (dev only)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}

jobs:
  source:
    name: Source and release policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact: ${{ steps.policy.outputs.artifact }}
      channel: ${{ steps.policy.outputs.channel }}
      version: ${{ steps.policy.outputs.version }}
      test_tag: ${{ steps.policy.outputs.test_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source and bundled music
        run: python3 Tools/Validate-Source.py
      - name: Check build policy
        id: policy
        env:
          CINDER_TEST_RELEASE: ${{ inputs.test_release && 'true' || 'false' }}
        run: python3 Tools/Check-Release.py
      - name: Test branch and release rules
        run: python3 -m unittest discover -s Tests/Tooling -v
      - name: Check shell syntax
        run: |
          for script in *.sh *.command; do
            bash -n "$script"
          done

  macos:
    name: Staging / release · macOS 27
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: source
    # GitHub's macOS 27 / Xcode 27 image is currently a public preview.
    # The scripts verify the actual host, compiler, SDK and architecture.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Mac dependencies
        run: bash Setup-Mac.command
      - name: Check Swift 6 migration mode
        run: bash Check-Xcode.command swift6
      - name: Test and build DMG
        run: bash Build-DMG.command
      - name: Archive app with executable permissions
        env:
          ARTIFACT_NAME: ${{ needs.source.outputs.artifact }}
          BUILD_CHANNEL: ${{ needs.source.outputs.channel }}
        run: |
          source ./Build-Identity.sh
          ditto -c -k --sequesterRsrc --keepParent "dist/$APP_NAME.app" "dist/$ARTIFACT_NAME.zip"
          cd dist
          DMG_NAME="${PRODUCT_NAME}-v${PUBLIC_VERSION}-${TARGET_ARCH}.dmg"
          if [[ "$DMG_NAME" != "$ARTIFACT_NAME.dmg" ]]; then
            mv "$DMG_NAME" "$ARTIFACT_NAME.dmg"
            rm "$DMG_NAME.sha256"
          fi
          shasum -a 256 "$ARTIFACT_NAME.dmg" > "$ARTIFACT_NAME.dmg.sha256"
          shasum -a 256 "$ARTIFACT_NAME.zip" > "$ARTIFACT_NAME.zip.sha256"
          printf 'Channel: %s\nVersion: %s\nCommit: %s\nSigning: local ad-hoc; not notarized\n' \
            "$BUILD_CHANNEL" "$PUBLIC_VERSION" "$GITHUB_SHA" > "$ARTIFACT_NAME.txt"
      - name: Upload app and DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.source.outputs.artifact }}
          path: |
            dist/${{ needs.source.outputs.artifact }}.dmg
            dist/${{ needs.source.outputs.artifact }}.dmg.sha256
            dist/${{ needs.source.outputs.artifact }}.zip
            dist/${{ needs.source.outputs.artifact }}.zip.sha256
            dist/${{ needs.source.outputs.artifact }}.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/mac-setup/*.log
            .build/mac-setup/*.txt
            .build/compatibility-swift6/*.log
            .build/compatibility-swift6/*.txt
            .build/golden-gate-app/*.log
          include-hidden-files: true
          retention-days: 7

  test-release:
    name: Prepare test release draft
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && inputs.test_release
    needs: [source, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.source.outputs.artifact }}
          path: release-assets
      - name: Create draft marked as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TEST_TAG: ${{ needs.source.outputs.test_tag }}
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[].tag_name' > "$RUNNER_TEMP/test-release-tags.txt"
          if grep -Fxq "$TEST_TAG" "$RUNNER_TEMP/test-release-tags.txt"; then
            existing_target="$(gh release view "$TEST_TAG" --json targetCommitish --jq .targetCommitish)"
            if [[ "$existing_target" != "$GITHUB_SHA" ]]; then
              echo "Release $TEST_TAG already exists for another target; inspect it before retrying." >&2
              exit 1
            fi
            echo "Release $TEST_TAG already exists; keeping its original notes and assets."
            exit 0
          fi
          gh api "repos/$GH_REPO/git/matching-refs/tags/$TEST_TAG" \
            --jq '.[].ref' > "$RUNNER_TEMP/test-git-tags.txt"
          if grep -Fxq "refs/tags/$TEST_TAG" "$RUNNER_TEMP/test-git-tags.txt"; then
            echo "Tag $TEST_TAG already exists without a release; inspect it before retrying." >&2
            exit 1
          fi
          {
            printf 'Test build of Cinder %s. This is not a stable release.\n\n' "$VERSION"
            printf 'Source branch: `%s`\n\n' "$GITHUB_REF_NAME"
            printf 'Source commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Build run: %s (attempt %s)\n\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf '[Build and validation logs](%s/%s/actions/runs/%s)\n\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            cat Docs/INSTALLING.md
          } > "$RUNNER_TEMP/test-release-notes.md"
          gh release create "$TEST_TAG" release-assets/* \
            --target "$GITHUB_SHA" --draft --prerelease --latest=false \
            --title "Cinder $TEST_TAG" \
            --notes-file "$RUNNER_TEMP/test-release-notes.md"

  release:
    name: Prepare release draft
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [source, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.source.outputs.artifact }}
          path: release-assets
      - name: Create draft for final release review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --draft --title "Cinder $RELEASE_TAG" \
            --notes-file Docs/RELEASE-DRAFT.md
